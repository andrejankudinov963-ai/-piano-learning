<!doctype html>

<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d14">
  <meta name="description" content="Piano Learning — интерактивный курс игры на пианино с микрофоном, нотным станом и пошаговой практикой.">
  <title>Piano Learning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <header class="topbar">
    <button id="brand" class="brand" aria-label="На главную">
      <span class="brand-icon">✦</span>
      <span>Piano Learning</span>
    </button>

```
<div class="topStats">
  <span id="streak" class="stat">🔥 0 дней</span>
  <span id="xpTop" class="stat">0 XP</span>
</div>
```

  </header>

  <main id="app" class="appShell">
    <section id="home" class="screen active"></section>
    <section id="course" class="screen"></section>
    <section id="practice" class="screen"></section>
    <section id="songs" class="screen"></section>
    <section id="lesson" class="screen"></section>
    <section id="song" class="screen"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="bottomNav" aria-label="Навигация">
    <button data-nav="home" class="active">
      <span>⌂</span>
      <small>Главная</small>
    </button>

```
<button data-nav="course">
  <span>▦</span>
  <small>Курс</small>
</button>

<button data-nav="practice">
  <span>◎</span>
  <small>Практика</small>
</button>

<button data-nav="songs">
  <span>♪</span>
  <small>Песни</small>
</button>
```

  </nav>

  <script src="app.js"></script>

</body>
</html>
