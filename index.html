<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piano Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Шапка -->
        <header>
            <div class="logo">🎹 Piano Quest</div>
            <div class="header-stats">
                <span id="streakDisplay">🔥 1 день</span>
                <span id="xpDisplay">⭐ 0 XP</span>
            </div>
        </header>

        <!-- Навигация -->
        <nav>
            <button class="nav-btn active" data-tab="course">Курс</button>
            <button class="nav-btn" data-tab="practice">Практика</button>
            <button class="nav-btn" data-tab="songs">Песни</button>
        </nav>

        <!-- Основной контент -->
        <main>
            <!-- Вкладка "Курс" -->
            <section id="course" class="tab-content active">
                <h2>Курс</h2>
                <div id="lessonList"></div>
                <div id="lessonDetail"></div>
            </section>

            <!-- Вкладка "Практика" -->
            <section id="practice" class="tab-content">
                <h2>Практика</h2>
                <div class="practice-tabs">
                    <button class="practice-btn active" data-mode="notes">Ноты</button>
                    <button class="practice-btn" data-mode="chords">Аккорды</button>
                </div>
                <div id="practiceContent"></div>
            </section>

            <!-- Вкладка "Песни" -->
            <section id="songs" class="tab-content">
                <h2>Библиотека песен</h2>
                <div id="songsList"></div>
                <div id="songDetail"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
